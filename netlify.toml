# TJ's Plumbing — security headers + policy page routing
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"

# Added Nov 4, 2026: HSTS site-wide, and a strict Content-Security-Policy on the
# static service pages (no scripts run there). The homepage has no CSP yet because
# it loads the chat widget from another domain.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/emergency-plumber/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self'; style-src 'self'; script-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"

